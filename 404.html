<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Octopus AI</title>

  <style>
    :root {
      --bg: #020711;
      --text: #eef9ff;
      --muted: rgba(238, 249, 255, 0.68);
      --cyan: #22d3ee;
      --teal: #2dd4bf;
      --violet: #a78bfa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.18), transparent 30%),
        radial-gradient(circle at 80% 10%, rgba(167, 139, 250, 0.18), transparent 32%),
        radial-gradient(circle at 50% 95%, rgba(45, 212, 191, 0.14), transparent 36%),
        linear-gradient(135deg, #020711 0%, #03111f 45%, #07152c 100%);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    .blob {
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(38px);
      opacity: 0.35;
      animation: floaty 7s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .blob.one {
      left: -120px;
      top: 12%;
      background: rgba(34, 211, 238, 0.45);
    }

    .blob.two {
      right: -120px;
      top: 8%;
      background: rgba(167, 139, 250, 0.45);
      animation-delay: -2s;
    }

    .blob.three {
      left: 40%;
      bottom: -180px;
      background: rgba(45, 212, 191, 0.3);
      animation-delay: -4s;
    }

    @keyframes floaty {
      from {
        transform: translateY(-18px) scale(1);
      }

      to {
        transform: translateY(28px) scale(1.06);
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(520px, 100%);
      padding: 38px 28px;
      border-radius: 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.075);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(24px);
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.38);
    }

    .octo {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 32px;
      font-size: 52px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.28), transparent 24%),
        linear-gradient(135deg, rgba(34, 211, 238, 0.28), rgba(167, 139, 250, 0.26));
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 24px 80px rgba(34, 211, 238, 0.18);
      animation: octoFloat 2.8s ease-in-out infinite alternate;
    }

    @keyframes octoFloat {
      from {
        transform: translateY(-5px) rotate(-2deg);
      }

      to {
        transform: translateY(8px) rotate(2deg);
      }
    }

    .kicker {
      color: var(--cyan);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(34px, 7vw, 58px);
      line-height: 0.95;
      letter-spacing: -0.05em;
      margin-bottom: 16px;
    }

    h1 span {
      color: transparent;
      background: linear-gradient(120deg, #e0ffff, var(--cyan), var(--violet));
      -webkit-background-clip: text;
      background-clip: text;
    }

    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
      margin-bottom: 24px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 20px;
      border-radius: 18px;
      color: #02111d;
      background: linear-gradient(135deg, #67e8f9, #2dd4bf);
      text-decoration: none;
      font-size: 14px;
      font-weight: 950;
      box-shadow: 0 18px 50px rgba(34, 211, 238, 0.24);
      transition: 0.22s ease;
    }

    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 64px rgba(34, 211, 238, 0.34);
    }

    .note {
      margin-top: 18px;
      color: rgba(238, 249, 255, 0.42);
      font-size: 12px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <main class="card">
    <div class="octo">🐙</div>
    <div class="kicker">404 · Lost Route</div>
    <h1>This page drifted into the <span>Kerala backwaters</span></h1>
    <p>
      Octopus AI could not find this page. The link may be wrong,
      or this route is not available on the website yet.
    </p>
    <a href="/">Back to Octopus AI →</a>
    <div class="note">Octopus AI · Kerala travel assistant</div>
  </main>
</body>

</html>
